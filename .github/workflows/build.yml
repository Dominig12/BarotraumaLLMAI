name: build

# Builds and tests the game-independent part (LlmAgents.Core, tests, simulator).
# The server plugin itself needs the publicized game DLLs in Refs/, which are not in the repo,
# so it is built locally (tools/package.ps1). If Refs/ is ever present in CI, it is built too.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test core
        run: dotnet test tests/LlmAgents.Tests -c Release
      - name: Build simulator
        run: dotnet build tools/LlmAgents.Sim -c Release
      - name: Build server plugin (only if Refs are available)
        if: hashFiles('Refs/Linux/DedicatedServer.dll') != ''
        run: dotnet build src/LlmAgents.Server -c Release -p:GamePlatform=Linux
