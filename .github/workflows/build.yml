name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download game reference DLLs
        run: tools/get-refs.sh
      - name: Test
        run: dotnet test tests/LlmAgents.Tests -c Release
      - name: Package mod
        run: tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LlmAgents
          path: dist/LlmAgents
